# Расписание режимов. Время приблизительное: день нерегулярный, поэтому
# расписание задаёт только режим по умолчанию, а точные переходы — по сигналам.

timezone: Asia/Jerusalem

days:
  sun_thu: { work_from: "05:00", work_until_default: "17:30" }
  fri:     { work_from: "05:00", work_until_default: "13:00" }
  sat:     { mode: weekend }

modes:
  morning:          # 05:00 – выезд (~05:50)
    style: деловая, бодрая
    actions: [приветствие, план дня, задачи и объекты на сегодня]
  commute:          # дорога на работу и домой
    style: только голос, короткие ответы, без аватара на экране
    private: запрещён   # в машине едет коллега, и это время за рулём
  work:             # на объекте
    style: деловая
  lunch_private:    # время плавающее (11:00–14:00), включается вручную
    entry: голосом или кнопкой («обед, я один») + подтверждение «да»
    auto_return_to_work_after_min: 45
    panic: мгновенный возврат в work
  evening:          # после работы
    style: свободная, тёплая
    private: по запросу, с подтверждением «да»
  weekend:          # суббота
    style: неделовая, «день вместе»; о работе только если сам заговоришь
    private: по запросу, с подтверждением «да»

confirmation:       # ADR 0009: вход в приват и конец дня — только после нейтрального переспроса и «да»
  private: "Перерыв? Мне переключиться?"
  evening: "Заканчиваем на сегодня? Переключаюсь?"
  instant: [паника, за работу]   # возврат к работе — мгновенно

signals:            # что точно переключает режим
  end_of_work:
    - голосом: «еду домой», «рабочий день окончен»
    - начало движения на машине после рабочего режима (распознавание активности Android, локально)
  arrived_home:
    - геозона «дом» (вычисляется на телефоне, никуда не отправляется)
  manual: голос, кнопка или виджет в любой момент

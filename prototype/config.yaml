# Настройки прототипа. Любой движок меняется здесь, код трогать не нужно.
persona: ../persona/mira.yaml
models_dir: ../models

llm:
  engine: llamacpp
  # Одна модель без цензуры на все режимы (ADR 0007). Кандидаты сравниваем на этапе 2.
  model: Huihui-gemma-3n-E4B-it-abliterated.Q4_K_M.gguf   # выбрана 17.10.2026 (ADR 0007)
  context: 8192
  temperature: 0.8
  top_p: 0.9
  min_p: 0.05
  repeat_penalty: 1.1        # меньше повторов одних и тех же фраз
  presence_penalty: 0.3
  max_tokens: 400
  gpu_layers: -1             # всё на GPU (Metal)

stt:
  engine: whispercpp
  model: ggml-small.bin
  language: ru               # ru | he | en | auto

vad:
  engine: silero
  threshold: 0.5
  min_silence_ms: 700        # сколько тишины считать концом фразы

tts:
  engine: silero             # silero — быстрый; f5 — живой нейросетевой голос по образцу
  language: ru
  model_id: v5_6_ru          # v5_6: вопросы, восклицания, ударения
  speaker: baya              # варианты: xenia, baya, kseniya, aidar, eugene
  sample_rate: 48000
  f5:
    ref_audio: ../persona/voices/mira_ref.wav   # образец голоса 10–20 с
    ref_text: ../persona/voices/mira_ref.txt    # что сказано в образце
    nfe_step: 16                                # 16 — быстро, 32 — чище
    speed: 1.0

audio:
  barge_in: false            # перебивание; включать только в наушниках, иначе она слышит сама себя

history_turns: 20
packs_dir: ../packs             # пакеты знаний .kpack (tools/ingest)
memory_db: data/mira.db       # память Миры; в git не попадает (prototype/data/ в .gitignore)            # сколько последних реплик держать в контексте
